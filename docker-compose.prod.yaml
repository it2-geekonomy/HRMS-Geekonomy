services:

  # ------------------------
  # PostgreSQL Database
  # ------------------------
  horilla-db:
    image: postgres:16
    container_name: horilla-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-horilla}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - horilla-data:/var/lib/postgresql/data
    # Not published to the host — only reachable on the Docker network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-horilla}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------
  # Django App (Gunicorn)
  # ------------------------
  horilla-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: horilla-hrms
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      TIME_ZONE: ${TIME_ZONE:-Asia/Kolkata}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}

      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-people.geekonomy.in,localhost,127.0.0.1,horilla-nginx}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://people.geekonomy.in}

      USE_X_FORWARDED_HOST: "True"
      SECURE_PROXY_SSL_HEADER: "HTTP_X_FORWARDED_PROTO,https"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}

      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@horilla-db:5432/${POSTGRES_DB:-horilla}
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: ${POSTGRES_DB:-horilla}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: "horilla-db"
      DB_PORT: "5432"

      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      CRM_API_KEY: ${CRM_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Geekonomy HRMS <hr@thegeekonomy.com>}
      HR_EMAIL: ${HR_EMAIL:-hr@thegeekonomy.com}

      # 2GB droplet: keep workers low to avoid OOM
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}

    volumes:
      - horilla-media:/app/media
      - horilla-static:/app/staticfiles

    depends_on:
      horilla-db:
        condition: service_healthy

  # ------------------------
  # Nginx (Reverse Proxy)
  # ------------------------
  horilla-nginx:
    image: nginx:alpine
    container_name: horilla-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - horilla-static:/app/staticfiles:ro
      - horilla-media:/app/media:ro
    depends_on:
      - horilla-app

volumes:
  horilla-data:
  horilla-media:
  horilla-static:
