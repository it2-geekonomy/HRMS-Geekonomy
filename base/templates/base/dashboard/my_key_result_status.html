{% load i18n %}

<div style="padding: 10px;">
    {% if data %}
        <!-- Summary -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span style="font-size: 12px; color: #64748b;">{% trans "Total Key Results" %}</span>
            <span style="font-size: 18px; font-weight: bold; color: #1e293b;">{{ total }}</span>
        </div>
        
        <!-- Status breakdown -->
        <div style="max-height: 280px; overflow-y: auto;">
            {% for status, count in data.items %}
                <div class="d-flex justify-content-between align-items-center p-2 mb-2" 
                     style="background: {% if 'Track' in status %}#dcfce7{% elif 'Behind' in status %}#fef3c7{% elif 'Risk' in status %}#fee2e2{% else %}#f1f5f9{% endif %}; 
                            border-radius: 6px; 
                            border-left: 3px solid {% if 'Track' in status %}#22c55e{% elif 'Behind' in status %}#f59e0b{% elif 'Risk' in status %}#ef4444{% else %}#94a3b8{% endif %};">
                    <span style="font-size: 12px; color: #475569;">{{ status }}</span>
                    <span style="font-size: 16px; font-weight: bold; 
                                 color: {% if 'Track' in status %}#16a34a{% elif 'Behind' in status %}#d97706{% elif 'Risk' in status %}#dc2626{% else %}#64748b{% endif %};">
                        {{ count }}
                    </span>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="text-center py-4" style="color: #94a3b8;">
            <i class="material-icons" style="font-size: 32px; opacity: 0.5;">track_changes</i>
            <div style="font-size: 12px; margin-top: 5px;">{% trans "No key results assigned" %}</div>
        </div>
    {% endif %}
</div>
