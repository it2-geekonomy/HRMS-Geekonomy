# Nginx → Gunicorn → Django (Horilla HRMS prod)
# Static and media served by Nginx for speed.
# Resolver + variable proxy_pass so Nginx re-resolves horilla-app when the container IP changes (avoids 502 after app restart).

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;
    # Docker embedded DNS: re-resolve upstream so 502 stops after app container restart
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compress HTML/JSON to reduce transfer size (helps dashboard HTMX and API)
    gzip on;
    gzip_vary on;
    gzip_min_length 500;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Static files (collected by Django collectstatic)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media uploads
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy all other requests to Gunicorn (variable forces resolver use so upstream IP updates)
    location / {
        set $upstream_backend horilla-app:8000;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # Buffer larger responses so Nginx doesn't stream slowly to the client
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;
    }
}
