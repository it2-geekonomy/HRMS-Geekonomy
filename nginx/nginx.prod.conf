# Nginx → Gunicorn → Django (Horilla HRMS prod)
# HTTP → HTTPS redirect + TLS on 443 (Let's Encrypt)

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ACME HTTP-01 + redirect everything else to HTTPS
server {
    listen 80;
    server_name people.thegeekonomy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name people.thegeekonomy.com;
    client_max_body_size 100M;

    # De-index internal HRMS — do not allow Google/Bing to index any URL
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    ssl_certificate     /etc/letsencrypt/live/people.thegeekonomy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/people.thegeekonomy.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 500;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n\nUser-agent: Googlebot\nDisallow: /\n\nUser-agent: Bingbot\nDisallow: /\n";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location / {
        set $upstream_backend horilla-app:8000;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }
}
