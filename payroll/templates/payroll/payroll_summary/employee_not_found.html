{% extends "index.html" %}
{% load i18n %}

{% block title %}{% trans "Employee Not Found" %}{% endblock title %}

{% block content %}
<div class="oh-wrapper">
    <div class="oh-main">
        <div class="oh-main__body">
            <div class="oh-card oh-card--border-0">
                <div class="oh-card-body text-center py-5">
                    <i class="oh-icon oh-icon--user-slash oh-icon--4x text-muted mb-3"></i>
                    <h4 class="text-muted">{% trans "Employee Not Found" %}</h4>
                    <p class="text-muted">{% trans "The requested employee could not be found." %}</p>
                    <a href="{% url 'employee-payroll-summary' %}" class="oh-btn oh-btn--primary">
                        <i class="oh-icon oh-icon--arrow-left me-2"></i>
                        {% trans "Back to Summary" %}
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
