{% extends 'index.html' %}
{% load static i18n %}

{% block content %}
<div class="oh-wrapper">
    <section class="oh-wrapper oh-main__topbar" style="padding-bottom: 1rem;">
        <div class="oh-main__titlebar oh-main__titlebar--left oh-d-flex-column--resp oh-mb-3--small">
            <h1 class="oh-main__titlebar-title fw-bold">{% trans "Candidate Data" %}</h1>
        </div>
        <div class="oh-main__titlebar oh-main__titlebar--right oh-d-flex-column--resp oh-mb-3--small d-flex flex-wrap align-items-center">
            <form
                id="filterForm"
                class="d-flex flex-wrap align-items-center gap-2"
                hx-get="{% url 'spring-verification-candidate-data' %}"
                hx-target="#candidateDataContainer"
                hx-trigger="submit, keyup from:#svSearch delay:300ms"
                hx-swap="innerHTML"
                onsubmit="event.preventDefault();"
            >
                <div class="oh-input-group oh-input__search-group">
                    <ion-icon name="search-outline" class="oh-input-group__icon oh-input-group__icon--left md hydrated" role="img" aria-label="search outline"></ion-icon>
                    <input
                        type="text"
                        name="search"
                        id="svSearch"
                        value="{{ search }}"
                        class="oh-input oh-input__icon"
                        placeholder="{% trans 'Search' %}"
                        aria-label="{% trans 'Search Input' %}"
                    />
                </div>
                <div class="oh-main__titlebar-button-container">
                    <div class="oh-dropdown" x-data="{open: false}">
                        <button type="button" class="oh-btn ml-2" @click="open = !open" onclick="event.preventDefault(); event.stopPropagation();">
                            <ion-icon name="filter" class="mr-1"></ion-icon>{% trans "Filter" %}
                        </button>
                        <div
                            class="oh-dropdown__menu oh-dropdown__menu--right oh-dropdown__filter p-4"
                            x-show="open"
                            @click.outside="open = false"
                            style="display: none;"
                        >
                            <div class="oh-dropdown__filter-body">
                                <div class="oh-accordion">
                                    <div class="oh-accordion-header">{% trans "Candidate" %}</div>
                                    <div class="oh-accordion-body">
                                        <div class="row">
                                            <div class="col-sm-12 col-md-12 col-lg-12">
                                                <div class="oh-input-group">
                                                    <label class="oh-label">{% trans "Status" %}</label>
                                                    <select name="status" class="oh-select mt-1 w-100">
                                                        <option value="">{% trans "All" %}</option>
                                                        {% for choice in status_choices %}
                                                        <option value="{{ choice }}" {% if status_filter == choice %}selected{% endif %}>{{ choice }}</option>
                                                        {% endfor %}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="oh-dropdown__filter-footer">
                                <button type="submit" class="oh-btn oh-btn--secondary oh-btn--small w-100 filterButton">{% trans "Filter" %}</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <div class="oh-main__titlebar-button-container ml-2">
                <a href="{% url 'spring-verification-dashboard' %}" class="oh-btn oh-btn--secondary oh-btn--small">{% trans "Back to Dashboard" %}</a>
            </div>
        </div>
    </section>

    <div class="oh-card mb-4">
        <div id="candidateDataContainer" class="oh-card__body">
            {% include "spring_verification/candidate_data_table.html" with candidates=candidates error_message=error_message %}
        </div>
    </div>
</div>
{% endblock content %}
