{% load i18n %} {% if form.errors %}
<!-- form errors  -->
<div class="oh-wrapper">
  <div class="oh-alert-container">
    {% for error in form.non_field_errors %}
    <div class="oh-alert oh-alert--animated oh-alert--danger">{{ error }}</div>
    {% endfor %}
  </div>
</div>
{% endif %}

<form
  hx-post="{% url 'request-cancel' id %}"
  hx-encoding="multipart/form-data"
  hx-disabled-elt="button[type=submit]"
  hx-indicator="#rejectSaveIndicator"
>
  <div class="oh-general__tab-target oh-profile-section">
    <div class="col-sm-12 col-md-12 col-lg-12">
      <label class="oh-label">{% trans "Reason" %}</label>
      {{form.reason}} {{form.errors}}
    </div>
    <div class="d-flex flex-row-reverse align-items-center gap-2 mt-3">
      <span id="rejectSaveIndicator" class="htmx-indicator" style="font-size: 0.9rem;">
        {% trans "Saving…" %}
      </span>
      <button
        type="submit"
        class="oh-btn oh-btn--secondary oh-btn--shadow"
        id="rejectSaveBtn"
      >
        {% trans "Save" %}
      </button>
    </div>
  </div>
</form>
